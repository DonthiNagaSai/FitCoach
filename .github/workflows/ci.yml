name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Public values only; real ones can be set as repository variables
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder' }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Smoke test (start server, hit /api/health)
        run: |
          cp -r .next/static .next/standalone/.next/static
          PORT=3000 HOSTNAME=127.0.0.1 APP_VERSION=${{ github.sha }} node .next/standalone/server.js &
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:3000/api/health; then echo; echo "Health check passed"; exit 0; fi
            sleep 1
          done
          echo "Server did not become healthy"; exit 1
